# This scheduled job pings the public demo every 10 minutes so the free
# Render server stays awake for judges. It needs no secrets.
name: keep-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the demo health check
        run: curl -fsS --retry 5 --retry-delay 10 --max-time 60 https://second-seat-payments.onrender.com/healthz
